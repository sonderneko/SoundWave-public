		var data = eval('('+data+')')
		showPage(data);

});
function showPage(d){
	dataId = d.main.id;//设置数据ID
	sendLog("enter");//访问量统计
	if(!d.success){alert(d.msg);return;}
	var column = d.column;
	var content = d.content;
	var music = d.music;
	for(var i=0; i<column.length; i++){
		var c = column[i];
		var htmlStr = '';
		switch(c.areaUiType){
		case 'banner': {
			htmlStr = createBanner(c,content[c.id],i);
		}break;
		case '4s': {
			htmlStr = create4s(c,content[c.id]);
		}break;
		case 'square': {
			htmlStr = createSquare(c,content[c.id]);
		}break;
		case 'mvsquare': {
			htmlStr = createMVsquare(c,content[c.id]);
		}break;
		case 'list': {
			htmlStr = createList(c,content[c.id]);
		}break;
		case 'music': {
			htmlStr = createMusic(c,content[c.id],music);
		}break;
		}
		//各专栏之间插入分隔
		if(i>1){
			$('#showdata').before('<p class="h10"></p>');
		}
		$('#showdata').before(htmlStr);
	}
	controlBanner();
	//自动调整图片高度，保持一致
	$('.square').height($('.square').width());
	$('.mvsquare').height($('.mvsquare').width()*(20/29));
}
