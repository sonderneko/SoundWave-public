# SoundWave v2 · Codemagic CI/CD (临时替代: CircleCI 已删 / GH Actions 配额 9/1 重置)
# 免费额度: Personal 账号 500 分钟/月 (macOS 标准实例), 安卓/GitHub 登录
#
# 接入步骤 (网页 5 分钟, 无需微软验证码):
#   1. 打开 https://codemagic.io/start/ → Sign in with GitHub → 授权
#   2. Add your first application → 选 GitHub → 连接 projects258036-svg/soundwave-v2
#   3. 签名密钥与凭据从 Codemagic 加密环境变量注入 (group: soundwave_signing,
#      Secure 勾选 6 个变量; 构建脚本内做证书指纹校验)。
#   4. 回分支页 → Start build → 选 android-release workflow → Start build
#   5. 构建结束在 Build → Artifacts 下载 SoundWave-<version>.apk
#
# 说明: 与 .github/workflows/build-apk.yml 逻辑一致 (keystore 指纹校验/APK 双工具验证)。
# 实例用 macOS 是为了消耗免费额度 (免费 500 分钟仅限 macOS 标准实例);
# Android SDK 在 macOS 实例上可用, 产物同样是 APK。
#
# 安全说明 (2026-09): 旧的公开 /releases/ 链接已移除；JKS 本体仍存放在服务器
# 受 Basic Auth 保护的 /signing/ 路径，通过 HTTPS 下载；下载凭据和签名口令保存在加密变量组。

workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - soundwave_signing
    scripts:
      # URL、Basic Auth 凭据、签名口令及证书指纹从 Codemagic 加密环境变量注入。
      # 在 Codemagic 网页 → App settings → Environment variables 建一个 group(勾选 Secure):
      #   ANDROID_RELEASE_KEYSTORE_URL  (keystore 下载地址, 短)
      #   ANDROID_RELEASE_KEYSTORE_AUTH (Basic Auth 头值, 短)
      #   ANDROID_RELEASE_STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD / CERT_SHA256
      # JKS 本体放服务器 /signing/，需 HTTPS + Basic Auth 才能下载(匿名访问 401);
      # jks 另有强密码保护, 密码只存在于本 secret, 不落公网。
      - name: Materialize signing key and build
        script: |
          set -euo pipefail
          KEYSTORE="$HOME/soundwave-release.jks"
          # 先严格拒绝非规范 URL；认证请求仅发给验证过的 HTTPS endpoint。
          KEYSTORE_URL="${ANDROID_RELEASE_KEYSTORE_URL:?missing ANDROID_RELEASE_KEYSTORE_URL}"
          case "$KEYSTORE_URL" in
            https://*) ;;
            *)
              echo "ANDROID_RELEASE_KEYSTORE_URL must use lowercase https://." >&2
              exit 1
              ;;
          esac
          if [[ ! "$KEYSTORE_URL" =~ ^https://[^/?#[:space:]]+([/?#][^[:space:]]*)?$ ]]; then
            echo "ANDROID_RELEASE_KEYSTORE_URL is not a canonical HTTPS URL." >&2
            exit 1
          fi
          test -n "${ANDROID_RELEASE_KEYSTORE_AUTH:?missing ANDROID_RELEASE_KEYSTORE_AUTH}"
          # 不跟随任何重定向(包括跨主机/协议)，并拒绝非 2xx 响应。
          HTTP_STATUS="$(curl --fail --silent --show-error --no-location \
            --proto '=https' --write-out '%{http_code}' \
            -H "Authorization: Basic ${ANDROID_RELEASE_KEYSTORE_AUTH}" \
            -o "$KEYSTORE" "$KEYSTORE_URL")"
          case "$HTTP_STATUS" in
            2??) ;;
            *)
              rm -f "$KEYSTORE"
              echo "Keystore download returned a non-success response; redirects are not followed." >&2
              exit 1
              ;;
          esac
          test -s "$KEYSTORE"
          test -n "$ANDROID_RELEASE_STORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          test -n "$ANDROID_RELEASE_CERT_SHA256"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" > "$HOME/release-key.txt"
          ACTUAL="$(awk -F': ' '/SHA256:/{print $2; exit}' "$HOME/release-key.txt" | tr -d ': ' | tr 'a-f' 'A-F')"
          WANT="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d ': ' | tr 'a-f' 'A-F')"
          test "$ACTUAL" = "$WANT"
          rm -f "$HOME/release-key.txt"
          export ANDROID_RELEASE_KEYSTORE_PATH="$KEYSTORE"
          export ANDROID_RELEASE_STORE_PASSWORD
          export ANDROID_RELEASE_KEY_ALIAS
          export ANDROID_RELEASE_KEY_PASSWORD
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 双工具验证 APK: apksigner 证书 + aapt 版本信息, 生成 checksums
      - name: Verify APK
        script: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          VER="$(tr -d '[:space:]' < VERSION)"
          CODE="${VER##*.}"
          GRADLE_VER="$(grep -E 'versionName "[^"]+"' app/build.gradle | head -1 | cut -d'"' -f2)"
          GRADLE_CODE="$(grep -E 'versionCode [0-9]+' app/build.gradle | head -1 | awk '{print $2}')"
          test "$VER" = "$GRADLE_VER"
          test "$CODE" = "$GRADLE_CODE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep "versionCode='${CODE}' versionName='${VER}'"
          APK_SHA="$(shasum -a 256 "$APK" | awk '{print $1}')"
          CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | awk '/SHA-256 digest/{print $NF; exit}' | tr -d '[:space:]')"
          test -n "$APK_SHA"
          test -n "$CERT_SHA"
          mkdir -p artifact
          cp "$APK" "artifact/SoundWave-${VER}.apk"
          {
            echo "commit=${CM_COMMIT:-unknown}"
            echo "apk_sha256=$APK_SHA"
            echo "cert_sha256=$CERT_SHA"
            echo "versionName=$VER"
            echo "versionCode=$CODE"
            echo "build_id=${CM_BUILD_ID:-unknown}"
          } > "artifact/SoundWave-${VER}.checksums.txt"

    artifacts:
      - app/build/outputs/apk/release/app-release.apk
      - artifact/*.txt
      - artifact/*.apk
